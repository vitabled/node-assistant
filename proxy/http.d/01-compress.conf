# Сжатие ответов, которые прокси отдаёт сам (http-контекст, подключается через
# conf.d). Статика из frontend-контейнера приходит УЖЕ сжатой — nginx не сжимает
# ответ с готовым Content-Encoding, поэтому здесь речь о /api/ (JSON) и о любых
# ответах, которые backend отдаёт без сжатия.
#
# ⚠️ Стриминговые эндпоинты (ndjson логов ИИ-чата) из сжатия ИСКЛЮЧЕНЫ явно —
# см. location /api/ai/ в snippets/app.conf: gzip/brotli-фильтр буферизует поток
# и превратил бы живой стрим в «приходит в конце».
#
# brotli требует модуля ngx_brotli (см. proxy/Dockerfile) — без него nginx не
# стартует, поэтому потерять сжатие «молча» нельзя.

gzip              on;
gzip_comp_level   6;
gzip_min_length   512;
gzip_vary         on;
gzip_proxied      any;
gzip_types        text/plain text/css text/xml text/javascript
                  application/javascript application/json application/xml
                  application/manifest+json application/wasm image/svg+xml;

brotli              on;
brotli_comp_level   6;
brotli_min_length   512;
brotli_types        text/plain text/css text/xml text/javascript
                    application/javascript application/json application/xml
                    application/manifest+json application/wasm image/svg+xml;
