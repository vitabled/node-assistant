# TLS parameters (Mozilla "intermediate"-style, ECDHE only → no dhparam needed).
ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# OCSP stapling is deliberately OFF: it needs a `resolver` and outbound access to
# the CA, and a flaky lookup shows up as slow handshakes — not worth it here.

# 1 year, no `preload`/`includeSubDomains`: the panel is one host, and preload is
# effectively irreversible. Remove this header if you ever need plain HTTP back.
add_header Strict-Transport-Security "max-age=31536000" always;

# Don't advertise the exact nginx version.
server_tokens off;
