# Container healthcheck target. Answers without touching any upstream, so a
# backend outage cannot mark the entry point itself unhealthy.
#
# ⚠️ Included in the port-80 block of BOTH templates *and* in the :443 block —
# NOT in app.conf. In TLS mode the port-80 block otherwise only keeps the ACME
# path and a blanket `return 301`, so the healthcheck (`wget http://127.0.0.1
# /healthz`) followed the redirect to https://127.0.0.1, failed certificate
# verification for the IP, and left the container permanently "unhealthy".
#
# ⚠️ `default_type`, NOT `add_header Content-Type`: any `add_header` in a location
# REPLACES the whole inherited header set, which silently dropped HSTS here.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
