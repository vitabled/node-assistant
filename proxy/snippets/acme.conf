# ACME http-01 challenge webroot (shared volume with the certbot container).
#
# ⚠️ This MUST stay reachable over plain HTTP even after the HTTPS redirect
# exists — Let's Encrypt validates renewals over http://, and a blanket
# `return 301` would break every renewal 60 days later.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    access_log off;
}
