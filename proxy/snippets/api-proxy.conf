# Общие директивы для /api/ и /api/ai/ (вынесены, чтобы не дублировать блок:
# у /api/ai/ те же настройки, но выключено сжатие — см. app.conf).
proxy_pass http://$up_backend;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Streaming endpoints (AI chat sends ndjson events, экспорт библиотеки, xlsx)
# must not be buffered, or the client sees nothing until the response ends.
proxy_buffering         off;
proxy_request_buffering off;

# Some endpoints are legitimately slow: «Анализ подписки» traceroutes every
# host, node stats open SSH sessions, panel metrics scrape over SSH.
# ⚠️ AI chat streams ndjson через /api/ai/chat: импорт архива из 100+ МБ
# занимает больше 10 минут, и старый 600s обрывал стрим ровно на 10-й
# минуте — фронт показывал «Ошибка соединения с ИИ» при живом backend.
# Держим тот же потолок, что у /ws/ (3600s = 1 час).
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
