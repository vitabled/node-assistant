add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

# Один и тот же URL отдаётся в нескольких кодировках (br / gzip / без сжатия),
# поэтому ответ обязан нести Vary: Accept-Encoding. Без него промежуточный кэш
# (браузер, корпоративный прокси) может сохранить brotli-версию и отдать её
# клиенту, который br не понимает — панель в этом случае не откроется вообще.
add_header Vary "Accept-Encoding" always;
