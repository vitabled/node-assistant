# Baseline response headers, applied on HTTP and HTTPS alike.
#
# Deliberately conservative — the panel is a React SPA that loads its own bundle,
# so no CSP is set here: a wrong one silently breaks the app, and the SPA's needs
# (inline styles, blob workers, the mihomo iframe) belong with the frontend, not
# the edge. These three are safe for any origin-served app.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options        "SAMEORIGIN" always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
