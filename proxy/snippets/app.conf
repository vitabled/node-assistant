# Routing shared by the HTTP-only and the TLS server blocks.
#
# API and WebSocket traffic goes STRAIGHT to the backend, deliberately bypassing
# the frontend's own nginx: that inner config has no upload limit, no streaming
# tweaks and a 60s read timeout, which would silently cap 25 MB library uploads
# and cut off streamed logs. All tuning lives here, in one place.

# Library uploads are 25 MB/file and export archives can be larger; nginx's
# default is 1 MB, which fails the upload with a 413.
client_max_body_size 64m;

# ⚠️ Upstreams are addressed through VARIABLES on purpose. With a literal
# `proxy_pass http://frontend:80`, nginx resolves the name at CONFIG LOAD time and
# REFUSES TO START when it doesn't resolve — so a stopped/rebuilding frontend
# would take the whole entry point (and TLS) down with it. Using a variable defers
# the lookup to request time via Docker's embedded DNS, turning that case into a
# plain 502 on the affected route.
resolver 127.0.0.11 ipv6=off valid=10s;
set $up_backend  "backend:8000";
set $up_frontend "frontend:80";

# /healthz lives in snippets/healthz.conf — it must also exist on port 80 in TLS
# mode, where this file is not included. See that file for why.

# `/internal/*` (e.g. /internal/agg-subs) is UNGATED by design — it is meant to
# be reachable only from inside the compose network by subs-aggregator. Never let
# it out through the public entry point.
location /internal/ {
    return 404;
}

# Live task logs (deploys, node ops, panel installs) stream over this socket for
# as long as a deploy runs — minutes, not seconds.
location /ws/ {
    proxy_pass http://$up_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    # Mapped, not hardcoded: a plain GET to /ws/ would otherwise reach the backend
    # with a bogus `Connection: upgrade` on a non-upgrade request. The map lives in
    # conf.d/00-upgrade-map.conf (http context — a map cannot sit in a server block).
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /api/ {
    proxy_pass http://$up_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming endpoints (AI chat sends ndjson events) must not be buffered, or
    # the client sees nothing until the response ends.
    proxy_buffering         off;
    proxy_request_buffering off;

    # Some endpoints are legitimately slow: «Анализ подписки» traceroutes every
    # host, node stats open SSH sessions, panel metrics scrape over SSH.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# Everything else is the SPA, served by the frontend container's nginx.
location / {
    proxy_pass http://$up_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
