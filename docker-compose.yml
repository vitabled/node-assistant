services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node-installer-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      # Shared docker network name — node-assistant attaches the xray-checker
      # container to it and reaches the checker by container name.
      - XRAY_CHECKER_NETWORK=node-assistant-net
      # The shared xray-checker probes the aggregator's combined subscription.
      - SUBS_AGGREGATOR_URL=http://subs-aggregator:8080/sub
      - SUBS_AGGREGATOR_REFRESH_URL=http://subs-aggregator:8080/refresh
      - SUBS_AGGREGATOR_STATUS_URL=http://subs-aggregator:8080/status
      # Shared secret guarding /internal/agg-subs + the aggregator's /refresh.
      # Set a strong value in .env for prod (empty = guard disabled, dev only).
      - AGG_TOKEN=${AGG_TOKEN:-}
      # Task/log store. `memory` (default) = single-container monolith.
      # `shared` = SQLite under node-data, required to hand deploys to the
      # `deploy-worker` container. Safe to leave on `shared` even without the
      # split profile. See docker-compose.split.md / CLAUDE.md §10.
      - TASK_STORE=${TASK_STORE:-memory}
    volumes:
      - node-data:/app/data
      # Docker-out-of-Docker: manage the sibling xray-checker container via the
      # host daemon. The backend runs as root, so it can read the socket.
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Merges every account's tracked subscriptions into one combined subscription
  # that the shared xray-checker probes (reached by container name on the shared
  # network). Reads the active set from the backend's internal /agg-subs endpoint.
  subs-aggregator:
    build:
      context: ./subs-aggregator
      dockerfile: Dockerfile
    container_name: subs-aggregator
    restart: unless-stopped
    environment:
      - AGG_SOURCE_URL=http://node-installer-backend:8000/internal/agg-subs
      - PORT=8080
      - AGG_TOKEN=${AGG_TOKEN:-}
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

  # MCP server image. Built here so it exists for the backend's DooD orchestrator
  # to `docker run` (managed like the xray-checker container — see services/
  # mcp_server.py). Profile-gated so `compose up` does NOT start it; build with:
  #   docker compose --profile mcp-build build mcp
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: node-installer-mcp:latest
    profiles: ["mcp-build"]
    networks:
      - app-net

  # -- Local NodeFlow HAProxy panel (Wave-7 «HAPROXY» local deploy) --------
  # Vendored upstream source in ./nodeflow. Built here so the backend's DooD
  # orchestrator (services/nodeflow_server.py) can `docker run` the images —
  # like the MCP container, compose does NOT start them (profile-gated). Build:
  #   docker compose --profile nodeflow-build build nodeflow-panel nodeflow-migrate
  # The backend then generates PKI/admin-token/signing-key and brings up
  # postgres → migrate → panel on this network, publishing only the agent mTLS
  # port (4200) to the host; the browser UI (8080) is reached by container name
  # through the backend proxy and is never host-published.
  nodeflow-panel:
    build:
      context: ./nodeflow
      dockerfile: Dockerfile.panel
    image: node-installer-nodeflow-panel:latest
    profiles: ["nodeflow-build"]
    networks:
      - app-net
  nodeflow-migrate:
    build:
      context: ./nodeflow
      dockerfile: Dockerfile.migrate
    image: node-installer-nodeflow-migrate:latest
    profiles: ["nodeflow-build"]
    networks:
      - app-net

  # -- CLIProxyAPI gateway (Wave-7 Plan F) ------------------------
  # LLM gateway reached with OAuth PROVIDER ACCOUNTS instead of API keys.
  # The backend orchestrates it over docker.sock (like the xray-checker and the
  # MCP container), so compose does NOT start it by default -- the profile is
  # here so `docker compose pull` can prefetch the pinned image.
  #
  # Deliberate choices, each with a reason that cost someone a day upstream:
  #   * the image lives on DOCKER HUB (not ghcr) and is PINNED;
  #   * the whole conf DIR is mounted, never the config FILE -- bind-mounting a
  #     not-yet-created file makes Docker invent a DIRECTORY in its place;
  #   * no `ports:` -- reachable only on the internal network;
  #   * healthcheck uses bash /dev/tcp because the image ships NO curl or wget;
  #   * the seeded config always carries a client key: an empty `api-keys` list
  #     turns the proxy into an OPEN relay.
  cli-proxy:
    image: eceasy/cli-proxy-api:v7.2.50
    container_name: node-installer-cliproxy
    profiles: ["cliproxy"]
    restart: unless-stopped
    command: ["./CLIProxyAPI", "--config", "/conf/config.yaml"]
    volumes:
      - cliproxy-conf:/conf
    expose:
      - "8317"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8317"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app-net

  # ── Optional service split (Plan M) ────────────────────────────
  # Both workers run the SAME image as the backend and serve NO HTTP; they take
  # over background duties via the lease table on the shared node-data volume
  # (services/worker_lease.py). Enable with:
  #     docker compose --profile split up -d
  # Disable by simply dropping the profile — the gateway resumes every duty by
  # itself within the lease TTL. Neither worker is a hard dependency.

  # Owns the 5 background loops (xray poller, user-stats collector, rules,
  # checker autostart, server monitor). Needs docker.sock because the poller and
  # autostart manage the shared xray-checker container.
  monitoring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node-installer-monitoring
    profiles: ["split"]
    restart: unless-stopped
    command: ["python", "-m", "app.worker", "monitoring"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_ROLE=monitoring
      - XRAY_CHECKER_NETWORK=node-assistant-net
      - SUBS_AGGREGATOR_URL=http://subs-aggregator:8080/sub
      - SUBS_AGGREGATOR_REFRESH_URL=http://subs-aggregator:8080/refresh
      - SUBS_AGGREGATOR_STATUS_URL=http://subs-aggregator:8080/status
      - AGG_TOKEN=${AGG_TOKEN:-}
      - TASK_STORE=${TASK_STORE:-memory}
    volumes:
      - node-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

  # Runs the 14-step SSH deploy pipeline and node operations claimed from the
  # shared task queue. REQUIRES TASK_STORE=shared (that is the queue + log bridge);
  # without it the gateway simply never offloads and keeps running deploys itself.
  deploy-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: node-installer-deploy-worker
    profiles: ["split"]
    restart: unless-stopped
    command: ["python", "-m", "app.worker", "deploy"]
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - SERVICE_ROLE=deploy-worker
      - XRAY_CHECKER_NETWORK=node-assistant-net
      - TASK_STORE=shared
    volumes:
      - node-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=/api
        - VITE_WS_BASE=/ws
    container_name: node-installer-frontend
    restart: unless-stopped
    # No host port: the `proxy` service is the single public entry point and
    # reaches this container by name. (Before the proxy existed this published
    # 80:80 — http://server/ still works, it is just served one hop earlier.)
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Public entry point: TLS termination + reverse proxy ────────
  # Always part of the stack. With no PROXY_DOMAIN/certificate it serves the panel
  # over plain HTTP on :80 (exactly what `frontend` used to do); once a
  # certificate exists it redirects to HTTPS and terminates TLS on :443.
  # See proxy/entrypoint.sh for why the config is rendered at runtime.
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: node-installer-proxy:latest
    container_name: node-installer-proxy
    restart: unless-stopped
    environment:
      # Empty → HTTP-only catch-all. Set by install.sh (or by hand in .env).
      - PROXY_DOMAIN=${PROXY_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    # ⚠️ service_STARTED, not service_healthy. The upstreams are resolved lazily
    # (see snippets/app.conf), so the proxy does not need a working backend to
    # boot — and it MUST boot regardless: waiting on backend health would mean a
    # broken backend also takes down the panel's error page AND blocks ACME
    # renewal, turning a recoverable outage into an expired certificate.
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Certificate issuance + renewal (http-01 over the webroot shared with `proxy`).
  #
  # Not pinned on purpose: an ACME client is exactly the kind of thing that must
  # keep up with CA-side deprecations, and `certbot renew` is idempotent.
  # The loop wakes every 12h; certbot itself no-ops until a cert is within 30
  # days of expiry. `$$` escapes the compose interpolation so the CONTAINER shell
  # sees `$!`. Issuance of the FIRST certificate is done by install.sh via
  # `docker compose run --rm certbot certonly …`.
  certbot:
    image: certbot/certbot:latest
    container_name: node-installer-certbot
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 43200 & wait $${!};
      done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    networks:
      - app-net

networks:
  app-net:
    # Explicit name so node-assistant can attach the xray-checker container to
    # this exact network (must match XRAY_CHECKER_NETWORK above).
    name: node-assistant-net
    driver: bridge

volumes:
  cliproxy-conf:
    name: node-cliproxy-conf
  node-data:
  # Let's Encrypt account + certificates (survives `compose down`; losing it
  # means re-issuing, which counts against the LE rate limit).
  letsencrypt:
    name: node-letsencrypt
  # http-01 challenge files, written by certbot and served by proxy.
  acme-webroot:
    name: node-acme-webroot
