# Static SPA only. This container is no longer the public entry point — the
# `proxy` service terminates TLS and routes /api/ and /ws/ straight to the
# backend (see proxy/snippets/app.conf), so the proxy blocks that used to live
# here were unreachable.
#
# ⚠️ Removing them is also what lets this container start when the backend is
# down: a literal `proxy_pass http://backend:8000` is resolved at config-load
# time, and nginx REFUSES TO START if the name does not resolve.
server {
    listen 80;
    listen [::]:80;  # IPv6: иначе healthcheck по http://localhost/ (резолвится в ::1) падает
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Отдача файлов: панель тянет ~230 файлов на первую загрузку, и каждый
    # stat()/open() — это latency. open_file_cache убирает часть syscall'ов,
    # sendfile+tcp_nopush склеивают заголовки с первым блоком тела.
    sendfile                 on;
    tcp_nopush               on;
    tcp_nodelay              on;
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    90s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Хешированные ассеты — кэш навсегда.
    # ⚠️ Один заголовок вместо `expires 1y` + `add_header`: nginx отдавал ДВА
    # Cache-Control (max-age=… и public, immutable) — часть клиентов и прокси
    # разбирает их непредсказуемо. `always` — чтобы заголовок был и на 304/404.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Нехешированные статики (js-yaml для iframe-конфигуратора mihomo, иконки
    # операторов, CSS флагов): имя файла не меняется при изменении содержимого,
    # поэтому «навсегда» здесь нельзя — сутки и ревалидация.
    location ~ ^/(mihomo|operators|flag-icons|flags) {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html (и любой SPA-fallback на него) обязан ревалидироваться, иначе
    # после деплоя браузер продолжит ходить по ссылкам на старые ассеты.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback — all other paths serve index.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
