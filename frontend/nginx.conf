# Static SPA only. This container is no longer the public entry point — the
# `proxy` service terminates TLS and routes /api/ and /ws/ straight to the
# backend (see proxy/snippets/app.conf), so the proxy blocks that used to live
# here were unreachable.
#
# ⚠️ Removing them is also what lets this container start when the backend is
# down: a literal `proxy_pass http://backend:8000` is resolved at config-load
# time, and nginx REFUSES TO START if the name does not resolve.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
