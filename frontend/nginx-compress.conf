# Сжатие текстовых ответов (http-контекст, подключается как conf.d/*.conf).
#
# brotli — основной, gzip — фолбэк для клиентов без br. Оба фильтра пропускают
# уже сжатые ответы (Content-Encoding стоит) и файлы вне gzip_types/brotli_types,
# так что woff2/png/jpeg не пережимаются.
#
# Пред-сжатые .br/.gz лежат рядом с ассетами (собираются на этапе docker build,
# brotli -q 11 / gzip -9): *_static отдаёт их как есть — это и меньше байт на
# проводе, и ноль CPU на сжатие в рантайме. Если пред-сжатого файла нет, nginx
# сжимает на лету (comp_level 6).
#
# ⚠️ brotli требует загруженного модуля ngx_brotli (см. frontend/Dockerfile,
# стадия nginx-mod). Без модуля nginx не стартует — это защищает от «тихой»
# потери сжатия при сборке образа.

gzip              on;
gzip_comp_level   6;
# 512, а не 1024 (дефолт статей): HTML-оболочка панели — 837 Б, и она в
# критическом пути отрисовки. Файлы меньше порога не сжимаются намеренно.
gzip_min_length   512;
gzip_vary         on;
gzip_proxied      any;
gzip_static       on;
gzip_types        text/plain text/css text/xml text/javascript
                  application/javascript application/json application/xml
                  application/manifest+json application/wasm image/svg+xml;

brotli              on;
brotli_comp_level   6;
brotli_min_length   512;
brotli_static       on;
brotli_types        text/plain text/css text/xml text/javascript
                    application/javascript application/json application/xml
                    application/manifest+json application/wasm image/svg+xml;
