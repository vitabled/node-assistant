<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Node Assistant</title>
    <!-- Шрифты (Inter / JetBrains Mono) теперь self-hosted — их CSS собирается
         из src/fonts.css, внешних запросов к fonts.googleapis.com больше нет:
         минус два сторонних DNS/TLS-раундтрипа на критическом пути отрисовки. -->
    <!-- Флаги стран — 420 КБ CSS (86% всего CSS панели). Грузим их АСИНХРОННО,
         чтобы не блокировать первую отрисовку; чипы флагов имеют фиксированный
         размер (.fi), поэтому подгрузка стилей не сдвигает раскладку (CLS = 0). -->
    <link rel="stylesheet" href="/flag-icons.min.css" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="/flag-icons.min.css" /></noscript>
  </head>
  <body data-density="comfortable">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
